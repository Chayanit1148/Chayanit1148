<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Dark Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        iframe { display: none; }
    </style>
</head>
<body>
    <iframe src="https://chayanit1148.github.io/Chayanit1148/paint.html"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const fogColor = 0x111111;
        scene.background = new THREE.Color(fogColor);
        scene.fog = new THREE.FogExp2(fogColor, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 2);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let isZooming = false;
        controls.addEventListener('start', () => { isZooming = false; });

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fireflyCount = 40;
        const fireflyGeometry = new THREE.BufferGeometry();
        const fireflyPositions = new Float32Array(fireflyCount * 3);
        const fireflyInitialY = new Float32Array(fireflyCount);
        const fireflySpeeds = new Float32Array(fireflyCount);

        for (let i = 0; i < fireflyCount; i++) {
            fireflyPositions[i * 3] = (Math.random() - 0.5) * 6;
            fireflyPositions[i * 3 + 1] = Math.random() * 3;
            fireflyPositions[i * 3 + 2] = (Math.random() - 0.5) * 6;
            fireflyInitialY[i] = fireflyPositions[i * 3 + 1];
            fireflySpeeds[i] = 0.5 + Math.random() * 1.5;
        }

        fireflyGeometry.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
        const fireflyMaterial = new THREE.PointsMaterial({
            color: 0xffea79,
            size: 0.04,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(fireflyGeometry, fireflyMaterial));

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveObjects = [];
        let targetCameraPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();

        new THREE.GLTFLoader().load('https://chayanit1148.github.io/Chayanit1148/portf.glb?v=' + Date.now(), (gltf) => {
            const model = gltf.scene;
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    interactiveObjects.push(child);
                }

                if (child.name.toLowerCase().includes('lamp')) {
                    const lampLight = new THREE.PointLight(0xfff0dd, 4.0, 12);
                    lampLight.castShadow = true;
                    lampLight.shadow.mapSize.set(1024, 1024);
                    
                    const worldPos = new THREE.Vector3();
                    child.getWorldPosition(worldPos);
                    lampLight.position.copy(worldPos);
                    scene.add(lampLight);
                }
            });
            scene.add(model);

            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());

            targetLookAt.copy(center);
            targetCameraPos.set(center.x, center.y + maxDim * 0.3, center.z + maxDim * 0.9);
            
            controls.target.copy(targetLookAt);
            camera.position.copy(targetCameraPos);
            controls.update();

            scene.fog.density = 1 / (maxDim * 8);
        });

        function focusOnObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());

            targetLookAt.copy(center);
            const offset = Math.max(maxDim * 1.5, 0.5);
            targetCameraPos.set(center.x, center.y + offset * 0.2, center.z + offset);
            isZooming = true;
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                let current = intersects[0].object;
                while (current && current !== scene) {
                    const name = current.name ? current.name.toLowerCase() : '';
                    if (name.includes('plane') || name.includes('computer') || name.includes('text') || name.includes('frame') || name.includes('board')) {
                        focusOnObject(current);
                        break;
                    }
                    current = current.parent;
                }
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            const positions = fireflyGeometry.attributes.position.array;
            for (let i = 0; i < fireflyCount; i++) {
                positions[i * 3 + 1] = fireflyInitialY[i] + Math.sin(elapsedTime * fireflySpeeds[i] + i) * 0.25;
                positions[i * 3] += Math.cos(elapsedTime * 0.5 + i) * 0.001;
            }
            fireflyGeometry.attributes.position.needsUpdate = true;
            fireflyMaterial.opacity = 0.6 + Math.sin(elapsedTime * 2) * 0.3;

            if (isZooming) {
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                if (camera.position.distanceTo(targetCameraPos) < 0.01) {
                    isZooming = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
