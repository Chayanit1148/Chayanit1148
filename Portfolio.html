<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        iframe { display: none; }
    </style>
</head>
<body>
    <iframe src="https://chayanit1148.github.io/Chayanit1148/paint.html"></iframe>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const fogColor = 0x111111;
        scene.background = new THREE.Color(fogColor);
        scene.fog = new THREE.FogExp2(fogColor, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 2);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let isZooming = false;
        controls.addEventListener('start', () => { isZooming = false; });

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const colors = new Uint8Array([100, 180, 255]);
        const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.LuminanceFormat);
        gradientMap.minFilter = THREE.NearestFilter;
        gradientMap.magFilter = THREE.NearestFilter;
        gradientMap.needsUpdate = true;

        const fireflyShaderMaterial = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0.0 } },
            vertexShader: `
                uniform float uTime;
                void main() {
                    vec3 pos = position;
                    pos.y += sin(uTime * 2.0 + position.x * 10.0) * 0.15;
                    pos.x += cos(uTime * 1.5 + position.y * 10.0) * 0.05;
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = 4.0;
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    if (d > 0.5) discard;
                    gl_FragColor = vec4(1.0, 0.9, 0.4, 0.85);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const fireflyCount = 40;
        const fireflyGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(fireflyCount * 3);
        for (let i = 0; i < fireflyCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 6;
            positions[i + 1] = Math.random() * 3;
            positions[i + 2] = (Math.random() - 0.5) * 6;
        }
        fireflyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        scene.add(new THREE.Points(fireflyGeometry, fireflyShaderMaterial));

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveObjects = [];
        let targetCameraPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();

        new THREE.GLTFLoader().load('https://chayanit1148.github.io/Chayanit1148/portf.glb?v=' + Date.now(), (gltf) => {
            const model = gltf.scene;
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    interactiveObjects.push(child);

                    const name = child.name.toLowerCase();

                    const isComputerScreen = name.includes('computer') || name.includes('screen') || name.includes('display') || name.includes('plane');

                    if (!isComputerScreen && child.material) {
                        const oldMap = child.material.map;
                        const oldColor = child.material.color ? child.material.color.clone() : new THREE.Color(0xffffff);

                        child.material = new THREE.MeshToonMaterial({
                            map: oldMap,
                            color: oldColor,
                            gradientMap: gradientMap
                        });
                        child.material.needsUpdate = true;
                    }
                }

                if (child.name.toLowerCase().includes('lamp')) {
                    const lampLight = new THREE.PointLight(0xfff0dd, 3.5, 12);
                    lampLight.castShadow = true;
                    lampLight.shadow.mapSize.set(1024, 1024);
                    
                    const worldPos = new THREE.Vector3();
                    child.getWorldPosition(worldPos);
                    lampLight.position.copy(worldPos);
                    scene.add(lampLight);
                }
            });
            scene.add(model);

            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());

            targetLookAt.copy(center);
            targetCameraPos.set(center.x, center.y + maxDim * 0.3, center.z + maxDim * 0.9);
            
            controls.target.copy(targetLookAt);
            camera.position.copy(targetCameraPos);
            controls.update();

            scene.fog.density = 1 / (maxDim * 8);
        });

        function focusOnObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray());

            targetLookAt.copy(center);
            const offset = Math.max(maxDim * 1.5, 0.5);
            targetCameraPos.set(center.x, center.y + offset * 0.2, center.z + offset);
            isZooming = true;
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                let current = intersects[0].object;
                while (current && current !== scene) {
                    const name = current.name ? current.name.toLowerCase() : '';
                    if (name.includes('plane') || name.includes('computer') || name.includes('text') || name.includes('frame') || name.includes('board')) {
                        focusOnObject(current);
                        break;
                    }
                    current = current.parent;
                }
            }
        }

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            fireflyShaderMaterial.uniforms.uTime.value = elapsedTime;

            if (isZooming) {
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                if (camera.position.distanceTo(targetCameraPos) < 0.01) {
                    isZooming = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
