<html>
    <head>
        <title>Paint</title>
          <style>
              body{
                  font-family:Arial;
                  margin:20px;
                  background:#eee;
              }

              button{
                  margin:2px;
                  padding:6px 12px;
                  border:1px solid #999;
                  background:#fff;
                  cursor:pointer;
              }

              button:hover{
                  background:#ddd;
              }

              .color{
                  width:30px;
                  height:30px;
                  padding:0;
              }

              #black{background:black;}
              #red{background:red;}
              #green{background:rgb(0, 255, 0);}
              #blue{background:blue;}
              #yellow{background:yellow;}

              .selected{
                  outline:2px solid #333;
                  outline-offset:1px;
                  box-shadow:inset 0 0 0 3px rgba(255,255,255,0.35);
              }

              canvas{
                  display:block;
                  margin-top:10px;
                  background:white;
              }

              button.selected{
                  background:#ccc;
                  box-shadow:inset 0 1px 3px #888;
              }
          </style>
    </head>
    <body>

<button class="tool" id="pencil">ดินสอ</button>
<button class="tool" id="line">เส้น</button>
<button class="tool" id="rectangle">สี่เหลี่ยม</button>
<button class="tool" id="ellipse">วงรี</button>
<button class="tool" id="eraser">ยางลบ</button>

<button class="size" id="size1">1</button>
<button class="size" id="size3">3</button>
<button class="size" id="size5">5</button>

<button class="color selected" id="black"></button>
<button class="color" id="red"></button>
<button class="color" id="green"></button>
<button class="color" id="blue"></button>
<button class="color" id="yellow"></button>

<canvas id="canvas" width="200" height="200"
style="width:800px; height:500px; border:1px solid #000; image-rendering:pixelated;">
</canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(canvas.width, canvas.height);
const data = imageData.data;
 // Array of color [R,G,B,A, R,G,B,A, ...]

function putPixel(x,y,r,g,b,a=255){
    if(x < 0 || x >= canvas.width || y < 0 || y >= canvas.height){
        return;
    }

    const idx = (y*canvas.width+x)*4;
    data[idx]=r;
    data[idx+1]=g;
    data[idx+2]=b;
    data[idx+3]=a;
}


function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      for(let yy = -Math.floor(lineWidth/2); yy <= Math.floor(lineWidth/2); yy++){
        for(let xx = -Math.floor(lineWidth/2); xx <= Math.floor(lineWidth/2); xx++){
          putPixel(x+xx, y+yy, r, g, b, a);
        }
      }
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      for(let yy = -Math.floor(lineWidth/2); yy <= Math.floor(lineWidth/2); yy++){
        for(let xx = -Math.floor(lineWidth/2); xx <= Math.floor(lineWidth/2); xx++){
          putPixel(x+xx, y+yy, r, g, b, a);
        }
      }
    }
  }
}

function drawRect(x1,y1, x2, y2, r, g, b, a = 255) {
    drawLine(x1, y1, x2, y1, r, g, b, a)
    drawLine(x2, y1, x2, y2, r, g, b, a)
    drawLine(x2, y2, x1, y2, r, g, b, a)
    drawLine(x1, y1, x1, y2, r, g, b, a)
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
    for(let angle = 0; angle < 360; angle++) {
        let rad = angle * Math.PI / 180;
        let x = Math.round(cx + rx * Math.cos(rad));
        let y = Math.round(cy + ry * Math.sin(rad));

        for(let yy = -Math.floor(lineWidth/2); yy <= Math.floor(lineWidth/2); yy++){
            for(let xx = -Math.floor(lineWidth/2); xx <= Math.floor(lineWidth/2); xx++){
                putPixel(x + xx, y + yy, r, g, b, a);
            }
        }
    }
}
function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

let isDragging = false;
let prevMouseX = 0;
let prevMouseY = 0;
let startMouseX = 0;
let startMouseY = 0;
let r = 0;
let g = 0;
let b = 0;
let lineWidth = 1;
let currentTool = "pencil";
let backupImageData;

document.getElementById('pencil').addEventListener('click', function(){
    currentTool = "pencil";
});

document.getElementById('line').addEventListener('click', function(){
    currentTool = "line";
});

document.getElementById('rectangle').addEventListener('click', function(){
    currentTool = "rectangle";
});

document.getElementById('ellipse').addEventListener('click', function(){
    currentTool = "ellipse";
});

document.getElementById('eraser').addEventListener('click', function(){
    currentTool = "eraser";
    r=255, g=255, b=255;
});

document.getElementById('size1').addEventListener('click', function(){
    lineWidth = 1;
});

document.getElementById('size3').addEventListener('click', function(){
    lineWidth = 3;
});

document.getElementById('size5').addEventListener('click', function(){
    lineWidth = 5;
});

document.getElementById('black').addEventListener('click', function(){
    r=0, g=0, b=0;
});

document.getElementById('red').addEventListener('click', function(){
    r=255, g=0, b=0;
});

document.getElementById('green').addEventListener('click', function(){
    r=0, g=255, b=0;
});

document.getElementById('blue').addEventListener('click', function(){
    r=0, g=0, b=255;
});

document.getElementById('yellow').addEventListener('click', function(){
    r=255, g=255, b=0;
});

canvas.addEventListener('mousedown', function(event) {
    isDragging=true;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    startMouseX = x;
    startMouseY = y;
    prevMouseX = x;
    prevMouseY = y;

    backupImageData = new ImageData(
        new Uint8ClampedArray(data),
        imageData.width,
        imageData.height
    );

    if(currentTool === "pencil"){
        drawLine(x, y, x, y, r, g, b);
    }else if(currentTool === "eraser"){
        drawLine(x, y, x, y, 255, 255, 255);
    }

    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mouseup', function(event) {
    if(!isDragging){
        return;
    }

    isDragging=false;
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);

    if(currentTool === "line" || currentTool === "rectangle" || currentTool === "ellipse"){
        data.set(backupImageData.data);

        if(currentTool === "line"){
            drawLine(startMouseX, startMouseY, x, y, r, g, b);
        }else if(currentTool === "rectangle"){
            drawRect(startMouseX, startMouseY, x, y, r, g, b);
        }else if(currentTool === "ellipse"){
            const cx = Math.round((startMouseX + x) / 2);
            const cy = Math.round((startMouseY + y) / 2);
            const rx = Math.round(Math.abs(x - startMouseX) / 2);
            const ry = Math.round(Math.abs(y - startMouseY) / 2);

            if(rx > 0 && ry > 0){
                drawEllipse(cx, cy, rx, ry, r, g, b);
            }
        }
    }

    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mousemove', function(event) {
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);

    if(isDragging){
        if(currentTool === "pencil"){
            drawLine(prevMouseX, prevMouseY, x, y, r, g, b);
            ctx.putImageData(imageData, 0, 0);
        }else if(currentTool === "eraser"){
            drawLine(prevMouseX, prevMouseY, x, y, 255, 255, 255);
            ctx.putImageData(imageData, 0, 0);
        }else{
            data.set(backupImageData.data);

            if(currentTool === "line"){
                drawLine(startMouseX, startMouseY, x, y, r, g, b);
            }else if(currentTool === "rectangle"){
                drawRect(startMouseX, startMouseY, x, y, r, g, b);
            }else if(currentTool === "ellipse"){
                const cx = Math.round((startMouseX + x) / 2);
                const cy = Math.round((startMouseY + y) / 2);
                const rx = Math.round(Math.abs(x - startMouseX) / 2);
                const ry = Math.round(Math.abs(y - startMouseY) / 2);

                if(rx > 0 && ry > 0){
                    drawEllipse(cx, cy, rx, ry, r, g, b);
                }
            }

            ctx.putImageData(imageData, 0, 0);
        }
    }

    prevMouseX = x;
    prevMouseY = y;
});

document.querySelectorAll('.tool').forEach(function(button){
    button.addEventListener('click', function(){
        document.querySelectorAll('.tool').forEach(function(item){
            item.classList.remove('selected');
        });
        this.classList.add('selected');
    });
});

document.querySelectorAll('.size').forEach(function(button){
    button.addEventListener('click', function(){
        document.querySelectorAll('.size').forEach(function(item){
            item.classList.remove('selected');
        });
        this.classList.add('selected');
    });
});

document.querySelectorAll('.color').forEach(function(button){
    button.addEventListener('click', function(){
        document.querySelectorAll('.color').forEach(function(item){
            item.classList.remove('selected');
        });
        this.classList.add('selected');
    });
});
</script>
    </body>
</html>
